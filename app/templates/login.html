{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="mb-1"><i class="bi bi-wallet2 text-marca"></i> Gastos &amp; Pagos</h4>
        <p class="text-muted small mb-4">Control de gastos, pagos y cuentas bancarias</p>
        <form method="post">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <div class="mb-3"><label class="form-label">Usuario</label>
            <input name="username" class="form-control" autofocus required></div>
          <div class="mb-3"><label class="form-label">Contraseña</label>
            <input name="password" type="password" class="form-control" required></div>
          <button class="btn btn-marca w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
