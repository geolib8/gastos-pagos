{% extends "base.html" %}
{% block title %}Nuevo gasto{% endblock %}
{% block content %}
<h3 class="mb-3">Nuevo gasto</h3>
<div class="card" style="max-width: 760px"><div class="card-body">
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Proveedor</label>
      <select name="proveedor_id" class="form-select" required>
        <option value="">Selecciona...</option>
        {% for p in proveedores %}<option value="{{ p.id }}" {{ 'selected' if request.form.proveedor_id == p.id|string }}>{{ p.nombre }}</option>{% endfor %}
      </select>
      <div class="form-text"><a href="{{ url_for('main.proveedores') }}">Agregar proveedor</a></div></div>
    <div class="col-md-6"><label class="form-label">Categoría</label>
      <select name="categoria_id" class="form-select" required>
        <option value="">Selecciona...</option>
        {% for c in categorias %}<option value="{{ c.id }}" {{ 'selected' if request.form.categoria_id == c.id|string }}>{{ c.nombre }}</option>{% endfor %}
      </select></div>
    <div class="col-12"><label class="form-label">Descripción</label>
      <input name="descripcion" class="form-control" value="{{ request.form.descripcion or '' }}" required></div>
    <div class="col-md-4"><label class="form-label">Monto (MXN)</label>
      <input name="monto" type="number" step="0.01" min="0.01" class="form-control" value="{{ request.form.monto or '' }}" required></div>
    <div class="col-md-4"><label class="form-label">Fecha del gasto</label>
      <input name="fecha_gasto" type="date" class="form-control" value="{{ request.form.fecha_gasto or hoy }}" required></div>
    <div class="col-md-4"><label class="form-label">Vencimiento</label>
      <input name="fecha_vencimiento" type="date" class="form-control" value="{{ request.form.fecha_vencimiento or '' }}"></div>
  </div>
  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-marca">Guardar</button>
    <a href="{{ url_for('main.gastos') }}" class="btn btn-light">Volver</a>
  </div>
</form>
</div></div>
{% endblock %}
